name: Validate Android MCP addon packaging

# Manual-only during integration; execute after the planned feature set is complete.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-safe-mcp-addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Checkout Godot 4.7.2 source for patch validation
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
      - name: Checkout public Android MCP addon
        uses: actions/checkout@v4
        with:
          repository: GeorgeMee/godot-mcp-android
          # Pin the reviewed upstream revision for reproducible packaging.
          ref: 5df91076250ece38ab182b2ca8b8a4a5d9a2d938
          path: godot-mcp-android-source
      - name: Validate Python syntax
        run: python -m py_compile scripts/package_safe_mcp_android.py scripts/apply_github_import_patch.py
      - name: Validate and apply Project Manager patches to upstream source
        run: python scripts/apply_github_import_patch.py
      - name: Package and validate safe MCP addon
        run: python scripts/package_safe_mcp_android.py
      - name: Parse and load addon in Godot headless editor
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ZIP="$RUNNER_TEMP/godot-linux.zip"
          GODOT_DIR="$RUNNER_TEMP/godot-headless"
          PROJECT_DIR="$RUNNER_TEMP/mcp-addon-test-project"
          curl --fail --location --retry 3 --output "$GODOT_ZIP" "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          mkdir -p "$GODOT_DIR" "$PROJECT_DIR/addons"
          unzip -q "$GODOT_ZIP" -d "$GODOT_DIR"
          GODOT_BIN="$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          cp -R "dist/addons/godot_mcp_android" "$PROJECT_DIR/addons/"
          cat > "$PROJECT_DIR/project.godot" <<'EOF'
          config_version=5

          [application]
          config/name="MCP Addon Validation"

          [editor_plugins]
          enabled=PackedStringArray("res://addons/godot_mcp_android/plugin.cfg")
          EOF
          set +e
          timeout 90 "$GODOT_BIN" --headless --editor --path "$PROJECT_DIR" --quit --verbose 2>&1 | tee "$RUNNER_TEMP/godot-addon-parse.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Godot headless editor exited with status $STATUS"
            exit "$STATUS"
          fi
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$RUNNER_TEMP/godot-addon-parse.log"; then
            echo "Godot reported an addon script/parser error."
            exit 1
          fi
          echo "Godot headless editor loaded the MCP plugin without script/parser errors."

      - name: Verify archive contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path("dist/godot-mcp-android-safe.zip")
          assert archive.is_file() and archive.stat().st_size > 0
          with ZipFile(archive) as zf:
              names = zf.namelist()
              assert "addons/godot_mcp_android/plugin.cfg" in names
              assert not any("execute_script_tool.gd" in name for name in names)
              registry = zf.read("addons/godot_mcp_android/scripts/protocol/mcp_tool_registry.gd").decode()
              assert "ExecuteScriptTool" not in registry
              assert "delete_project" not in registry
              assert "execute_script_tool.gd" not in "\\n".join(names)
              # New typed editor tools must be present in both the archive and registry.
              required_tools = {
                  "addons/godot_mcp_android/scripts/tools/editor/get_editor_state_tool.gd": "GetEditorStateTool",
                  "addons/godot_mcp_android/scripts/tools/editor/open_scene_tool.gd": "OpenSceneTool",
                  "addons/godot_mcp_android/scripts/tools/editor/run_scene_tool.gd": "RunSceneTool",
                  "addons/godot_mcp_android/scripts/tools/scene/get_node_properties_tool.gd": "GetNodePropertiesTool",
                  "addons/godot_mcp_android/scripts/tools/resource/create_resource_tool.gd": "CreateResourceTool",
                  "addons/godot_mcp_android/scripts/tools/editor/inspect_editor_ui_tool.gd": "InspectEditorUITool",
                  "addons/godot_mcp_android/scripts/tools/editor/activate_editor_ui_control_tool.gd": "ActivateEditorUIControlTool",
                  "addons/godot_mcp_android/scripts/tools/editor/send_editor_viewport_input_tool.gd": "SendEditorViewportInputTool",
                  "addons/godot_mcp_android/scripts/tools/editor/read_editor_diagnostics_tool.gd": "ReadEditorDiagnosticsTool",
                  "addons/godot_mcp_android/scripts/tools/scene/duplicate_node_tool.gd": "DuplicateNodeTool",
                  "addons/godot_mcp_android/scripts/tools/scene/rename_node_tool.gd": "RenameNodeTool",
                  "addons/godot_mcp_android/scripts/tools/scene/reparent_node_tool.gd": "ReparentNodeTool",
                  "addons/godot_mcp_android/scripts/tools/scene/inspect_scene_ui_controls_tool.gd": "InspectSceneUIControlsTool",
                  "addons/godot_mcp_android/scripts/tools/scene/interact_scene_ui_control_tool.gd": "InteractSceneUIControlTool",
                  "addons/godot_mcp_android/scripts/tools/scene/reorder_node_tool.gd": "ReorderNodeTool",
                  "addons/godot_mcp_android/scripts/tools/scene/set_node_group_tool.gd": "SetNodeGroupTool",
                  "addons/godot_mcp_android/scripts/tools/scene/manage_node_signal_tool.gd": "ManageNodeSignalTool",
              }
              for path, registration in required_tools.items():
                  assert path in names, f"missing packaged MCP tool: {path}"
                  assert registration in registry, f"tool not registered: {registration}"
              assert "execute_script_tool.gd" not in registry
              run_scene = zf.read("addons/godot_mcp_android/scripts/tools/editor/run_scene_tool.gd").decode()
              create_resource = zf.read("addons/godot_mcp_android/scripts/tools/resource/create_resource_tool.gd").decode()
              assert "the project has no main scene configured" in run_scene
              assert "FileAccess.file_exists(resource_path)" in create_resource
              assert "ResourceSaver.save" in create_resource
              inspect_ui = zf.read("addons/godot_mcp_android/scripts/tools/editor/inspect_editor_ui_tool.gd").decode()
              activate_ui = zf.read("addons/godot_mcp_android/scripts/tools/editor/activate_editor_ui_control_tool.gd").decode()
              assert "get_path_to(control)" in inspect_ui
              assert "activate_item(index)" in activate_ui
              assert "tabs.current_tab = tab_index" in activate_ui
              assert "options.select(option_index)" in activate_ui
              assert "text_value" in activate_ui and "numeric_value" in activate_ui
              assert "checked_value" in activate_ui
              assert "control is Range" in activate_ui
              assert "control is TextEdit" in activate_ui
              assert '"focus"' in activate_ui
              viewport_input = zf.read("addons/godot_mcp_android/scripts/tools/editor/send_editor_viewport_input_tool.gd").decode()
              assert "SubViewportContainer" in viewport_input and "viewport.push_input(event, true)" in viewport_input
              assert "separate external game process" in viewport_input
              diagnostics = zf.read("addons/godot_mcp_android/scripts/tools/editor/read_editor_diagnostics_tool.gd").decode()
              assert "RichTextLabel" in diagnostics and "TextEdit" in diagnostics
              assert "max_chars_per_control" in diagnostics
              duplicate_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/duplicate_node_tool.gd").decode()
              rename_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/rename_node_tool.gd").decode()
              reparent_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/reparent_node_tool.gd").decode()
              assert all("get_editor_undo_redo()" in tool and "undo_available" in tool for tool in (duplicate_node, rename_node, reparent_node))
              assert "is_ancestor_of(new_parent)" in reparent_node
              assert "_set_owner_recursive" in duplicate_node
              inspect_scene_ui = zf.read("addons/godot_mcp_android/scripts/tools/scene/inspect_scene_ui_controls_tool.gd").decode()
              interact_scene_ui = zf.read("addons/godot_mcp_android/scripts/tools/scene/interact_scene_ui_control_tool.gd").decode()
              assert '"rect"' in inspect_scene_ui
              assert all(action in interact_scene_ui for action in ('"press"', '"set_text"', '"set_value"', '"set_checked"', '"select_option"', '"focus"'))
              assert "separate running-game process" in interact_scene_ui
              reorder_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/reorder_node_tool.gd").decode()
              set_node_group = zf.read("addons/godot_mcp_android/scripts/tools/scene/set_node_group_tool.gd").decode()
              manage_node_signal = zf.read("addons/godot_mcp_android/scripts/tools/scene/manage_node_signal_tool.gd").decode()
              assert "undo_available" in reorder_node
              assert "add_to_group" in set_node_group
              assert "is_connected" in manage_node_signal
              assert "project deletion/removal is permanently blocked" in activate_ui
              assert "confirm_destructive" in activate_ui
              set_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/set_node_property_tool.gd").decode()
              remove_node = zf.read("addons/godot_mcp_android/scripts/tools/scene/remove_node_tool.gd").decode()
              http = zf.read("addons/godot_mcp_android/scripts/server/mcp_http_server.gd").decode()
              ws = zf.read("addons/godot_mcp_android/scripts/server/mcp_websocket_server.gd").decode()
              assert "get_editor_undo_redo()" in set_node and "add_undo_property" in set_node
              assert "get_editor_undo_redo()" in remove_node and "queue_free()" not in remove_node
              assert 'bind_host = "127.0.0.1"' in http and 'bind_host = "127.0.0.1"' in ws
              assert "Access-Control-Allow-Origin: *" not in http
              # There must be no project-deletion tool or generic script execution
              # implementation anywhere in the final archive, not just the registry.
              for name in names:
                  lowered = name.lower()
                  assert "delete_project" not in lowered
                  assert "execute_script_tool.gd" not in lowered
          print(f"Verified {len(names)} files in {archive}, including loopback, undo/redo, and no-eval checks")
          PY
      - name: Verify Android APK workflow embeds the hardened addon
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/build-godot-android-source.yml").read_text(encoding="utf-8")
          required = (
              "5df91076250ece38ab182b2ca8b8a4a5d9a2d938",
              "python scripts/package_safe_mcp_android.py",
              "src/main/assets/mcp-addon",
              "assets/mcp-addon/plugin.cfg",
              "assets/mcp-addon/scripts/protocol/mcp_tool_registry.gd",
              "assets/mcp-addon.zip",
              'bind_host = "127.0.0.1"',
              "Access-Control-Allow-Origin: *",
          )
          missing = [item for item in required if item not in workflow]
          assert not missing, f"Android APK workflow is missing MCP integration guards: {missing}"
          assert 'unzip -p "$APK" assets/mcp-addon/' in workflow, "final APK addon files are not inspected"
          assert 'unzip -p "$APK" assets/mcp-addon.zip' in workflow, "final APK installer bundle is not inspected"

          patcher = Path("scripts/apply_github_import_patch.py").read_text(encoding="utf-8")
          assert 'res://mcp-addon/' not in patcher, "installer must not treat raw APK asset directories as res:// resources"
          for item in (
              'Button *mcp_install_btn',
              '_show_mcp_install_dialog',
              '_install_mcp_addon_confirmed',
              'FileAccessAndroid bundled_asset',
              'bundled_asset.open_internal("mcp-addon.zip", FileAccess::READ)',
              'bundled_asset.get_buffer(buffer, requested)',
              'uint64_t remaining = bundled_asset.get_length()',
              'Ref<ZIPReader> zip',
              'godot_mcp_android/',
              'DirAccess::dir_exists_absolute(addon_target)',
              'config.set_value("editor_plugins", "enabled", enabled)',
              'github_search_more_btn = memnew(Button)',
              'github_search_more_btn->set_text(TTRC("Recargar siguientes 20"))',
              'void ProjectManager::_github_search_next_page()',
              '&page=',
              'String::utf8((const char *)p_body.ptr(), p_body.size())',
          ):
              assert item in patcher, f"Project Manager MCP installer missing safeguard or action: {item}"
          print("Android build workflow contains pinned addon, APK embedding, and final-package safety checks.")
          PY
      - name: Upload safe MCP addon
        uses: actions/upload-artifact@v4
        with:
          name: godot-mcp-android-safe
          path: dist/godot-mcp-android-safe.zip
          if-no-files-found: error
          retention-days: 30

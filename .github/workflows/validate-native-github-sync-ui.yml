name: Retired desktop validation (Android-only project)

# This workflow is intentionally inert. The product target is the Android editor;
# compiling the desktop editor is not an acceptance test for this project.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Retired: validate the Android APK and test on an Android device instead."

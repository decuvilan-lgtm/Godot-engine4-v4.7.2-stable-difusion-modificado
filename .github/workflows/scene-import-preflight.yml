name: Scene import preflight

on:
  push:
    branches:
      - work/mobile-ui-preflight
    paths:
      - "scripts/apply_github_import_patch.py"
      - "scripts/apply_preview_debug_menu_patch.py"
      - "scripts/validate_scene_import_fixture.py"
      - "tests/scene_import_fixtures/**"
      - ".github/workflows/scene-import-preflight.yml"
  pull_request:
    paths:
      - "scripts/apply_github_import_patch.py"
      - "scripts/apply_preview_debug_menu_patch.py"
      - "scripts/validate_scene_import_fixture.py"
      - "tests/scene_import_fixtures/**"
      - ".github/workflows/scene-import-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check patcher Python syntax
        run: python -m py_compile scripts/apply_github_import_patch.py scripts/apply_preview_debug_menu_patch.py scripts/validate_scene_import_fixture.py
      - name: Check nested, isolated, inherited, shared and missing-reference fixtures
        run: python scripts/validate_scene_import_fixture.py
      - name: Download official Godot 4.7.2 Linux editor for headless fixture import
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot-editor.zip"
          mkdir -p "$RUNNER_TEMP/godot-editor"
          unzip -q "$RUNNER_TEMP/godot-editor.zip" -d "$RUNNER_TEMP/godot-editor"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-editor" -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE/tests/scene_import_fixtures/nested" --quit --import
      - name: Checkout clean upstream Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
      - name: Apply GitHub import patch against clean upstream source
        run: python scripts/apply_github_import_patch.py
      - name: Apply preview debugger patch against the same clean source
        run: python scripts/apply_preview_debug_menu_patch.py

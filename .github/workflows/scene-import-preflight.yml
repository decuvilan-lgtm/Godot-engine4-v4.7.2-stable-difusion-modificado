name: Android-only validation policy

# Android-specific runtime validation must be performed on an Android device.
# This workflow is intentionally not triggered by pushes or pull requests.
# Do not add Linux editor/runtime tests here for this mobile-only modification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-device-validation-required:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Validation must be performed on the target Android device; no Linux runtime test is run."

name: Build Godot Android Editor (source pipeline)

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Choose full Android build or validate the GitHub import integration only"
        type: choice
        required: true
        default: full-android-build
        options:
          - full-android-build
          - validate-import-only
  push:
    paths:
      - ".github/workflows/build-godot-android-source.yml"
      - "patches/github-sync/**"
      - "scripts/apply_github_import_patch.py"

permissions:
  contents: read

jobs:
  build-android-editor:
    if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout official Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source

      - name: Apply GitHub import integration
        run: python "$GITHUB_WORKSPACE/scripts/apply_github_import_patch.py"

      - name: Set up Java 17
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        run: python -m pip install --upgrade pip scons

      - name: Download Android Swappy dependency
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source
        run: python misc/scripts/install_swappy_android.py

      - name: Compile Android editor engine
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache
        run: |
          scons platform=android target=editor arch=arm64 production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes -j2

      - name: Generate Android Editor APK
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source/platform/android/java
        run: ./gradlew generateGodotEditor

      - name: Upload APK and build outputs
        if: always() && (github.event_name == 'push' || inputs.run_type == 'full-android-build')
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-android-editor-build
          if-no-files-found: warn
          path: |
            godot-source/bin/android_editor_builds/**/*.apk
            godot-source/platform/android/java/editor/build/outputs/apk/**/*.apk
            godot-source/bin/android_editor_builds/**/*.aab

      # The generated editor is ARM64-only, so run it on an ARM64 Android system image.
      - name: Boot Android ARM64 emulator, launch APK, and capture UI
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p "$GITHUB_WORKSPACE/ui-test-results"
            APK="$(find "$GITHUB_WORKSPACE/godot-source" -type f -name '*.apk' | head -n 1)"
            test -n "$APK"
            echo "Testing APK: $APK"
            aapt dump badging "$APK" | tee "$GITHUB_WORKSPACE/ui-test-results/apk-badging.txt"
            PACKAGE="$(aapt dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
            test -n "$PACKAGE"
            echo "Package: $PACKAGE"

            # Xvfb is started as requested for headless graphical tooling; Android's screen
            # itself is captured through adb so the screenshot reflects the emulator display.
            Xvfb :99 -screen 0 1280x800x24 > "$GITHUB_WORKSPACE/ui-test-results/xvfb.log" 2>&1 &
            XVFB_PID=$!
            trap 'kill "$XVFB_PID" 2>/dev/null || true' EXIT
            export DISPLAY=:99
            for i in $(seq 1 20); do
              if xdpyinfo -display :99 >/dev/null 2>&1; then break; fi
              sleep 1
            done
            xdpyinfo -display :99 >/dev/null

            adb install -r "$APK"
            adb shell monkey -p "$PACKAGE" 1
            sleep 45
            adb shell screencap -p /sdcard/godot-editor-screen.png
            adb pull /sdcard/godot-editor-screen.png "$GITHUB_WORKSPACE/ui-test-results/godot-editor-screen.png"
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/ui-test-results/logcat.txt"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/ui-test-results/window.xml" || true

            if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
              echo "FAIL: Godot Editor process is not running after launch."
              tail -n 300 "$GITHUB_WORKSPACE/ui-test-results/logcat.txt"
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Fatal signal [0-9]+|SIGSEGV" "$GITHUB_WORKSPACE/ui-test-results/logcat.txt" | grep -F "$PACKAGE" >/dev/null; then
              echo "FAIL: fatal Android crash detected for $PACKAGE"
              exit 1
            fi
            echo "PASS: APK installed and its process remained alive after 45 seconds."
            echo "Review the screenshot and UI hierarchy artifact for visual layout/overlap issues."

      - name: Upload Android UI test evidence
        if: always() && (github.event_name == 'push' || inputs.run_type == 'full-android-build')
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-ui-test-evidence
          path: ui-test-results/
          if-no-files-found: warn
          retention-days: 30

  validate-import-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_type == 'validate-import-only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Checkout official Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
      - name: Validate import integration patcher syntax
        run: python -m py_compile scripts/apply_github_import_patch.py
      - name: Run import integration patcher
        run: python scripts/apply_github_import_patch.py

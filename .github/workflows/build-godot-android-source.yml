name: Build Godot Android Editor (source pipeline)

on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Choose full Android build or validate the GitHub import integration only"
        type: choice
        required: true
        default: full-android-build
        options:
          - full-android-build
          - validate-import-only
  push:
    paths:
      - ".github/workflows/build-godot-android-source.yml"
      - "patches/github-sync/**"
      - "scripts/apply_github_import_patch.py"

permissions:
  contents: read

jobs:
  build-android-editor:
    if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout official Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source

      - name: Apply GitHub import integration
        run: python "$GITHUB_WORKSPACE/scripts/apply_github_import_patch.py"

      - name: Set up Java 17
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        run: python -m pip install --upgrade pip scons

      - name: Download Android Swappy dependency
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source
        run: python misc/scripts/install_swappy_android.py

      - name: Compile Android editor engine for ARM64 phones and x86_64 emulator
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source
        run: |
          for arch in arm64 x86_64; do
            echo "Compiling Android editor for $arch"
            scons platform=android target=editor arch="$arch" production=yes dev_mode=yes module_text_server_fb_enabled=yes swappy=yes cache_path="${{ github.workspace }}/.scons-cache" -j2
          done

      - name: Generate Android Editor APK
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        working-directory: godot-source/platform/android/java
        run: ./gradlew generateGodotEditor

      - name: Upload APK and build outputs
        if: always() && (github.event_name == 'push' || inputs.run_type == 'full-android-build')
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.7.2-android-editor-build
          if-no-files-found: warn
          path: |
            godot-source/bin/android_editor_builds/**/*.apk
            godot-source/platform/android/java/editor/build/outputs/apk/**/*.apk
            godot-source/bin/android_editor_builds/**/*.aab

      # Stage the APK in the workspace root so the emulator action does not depend on
      # a nested path or its shell's inherited GITHUB_WORKSPACE environment variable.
      - name: Locate and stage APK for emulator test
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Searching generated APKs:"
          find "$GITHUB_WORKSPACE/godot-source" -type f -name '*.apk' -print
          APK="$(find "$GITHUB_WORKSPACE/godot-source" -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Gradle reported success but no APK was found."
            find "$GITHUB_WORKSPACE/godot-source" -type f -name '*.aab' -print | head -n 100
            find "$GITHUB_WORKSPACE/godot-source" -type f -name '*apk*' -print | head -n 100
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/godot-editor-test.apk"
          test -s "$GITHUB_WORKSPACE/godot-editor-test.apk"
          ls -lh "$GITHUB_WORKSPACE/godot-editor-test.apk"
          sha256sum "$GITHUB_WORKSPACE/godot-editor-test.apk"

      # The APK includes ARM64 for phones and x86_64 so the same artifact can be installed in the hosted emulator.
      - name: Boot Android x86_64 emulator, install APK, launch, and capture UI
        if: ${{ github.event_name == 'push' || inputs.run_type == 'full-android-build' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            bash "${{ github.workspace }}/scripts/android_emulator_smoke_test.sh" "${{ github.workspace }}"

      - name: Upload Android UI test evidence
        if: always() && (github.event_name == 'push' || inputs.run_type == 'full-android-build')
        uses: actions/upload-artifact@v4
        with:
          name: godot-android-ui-test-evidence
          path: ui-test-results/
          if-no-files-found: warn
          retention-days: 30

  validate-import-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_type == 'validate-import-only' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Checkout official Godot 4.7.2 source
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source
      - name: Validate import integration patcher syntax
        run: python -m py_compile scripts/apply_github_import_patch.py
      - name: Run import integration patcher
        run: python scripts/apply_github_import_patch.py

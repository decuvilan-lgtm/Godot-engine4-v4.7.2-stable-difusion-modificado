name: Validate GitHub sync core (no Godot build)

on:
  push:
    branches:
      - work/mobile-ui-preflight
      - feature/native-editor-integration
    paths:
      - "scripts/github_sync_core.py"
      - "scripts/github_sync_review.py"
      - "tests/test_github_sync_review.py"
      - "scripts/extend_safe_mcp_scene_tools.py"
      - "scripts/apply_github_sync_ui_patch.py"
      - "scripts/apply_github_sync_import_patch.py"
      - "scripts/apply_preview_debug_menu_patch.py"
      - "scripts/apply_debug_visualization_patch.py"
      - "scripts/package_safe_mcp_android.py"
      - "tests/test_native_editor_extensions.py"
      - "tests/test_preflight_features.py"
      - "tests/test_github_sync_core.py"
      - ".github/workflows/validate-github-sync-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-unit-tests:
    name: Python sync-core unit tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout official Godot 4.7.2 source for patch validation
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile scripts/github_sync_core.py scripts/github_sync_review.py scripts/extend_safe_mcp_scene_tools.py scripts/apply_github_sync_ui_patch.py scripts/apply_github_sync_import_patch.py scripts/apply_preview_debug_menu_patch.py scripts/apply_debug_visualization_patch.py scripts/package_safe_mcp_android.py tests/test_github_sync_core.py tests/test_github_sync_review.py tests/test_native_editor_extensions.py tests/test_preflight_features.py

      - name: Apply native GitHub analysis and additive import patches (no build)
        run: |
          python scripts/apply_github_sync_ui_patch.py
          python scripts/apply_github_sync_import_patch.py
          python scripts/apply_preview_debug_menu_patch.py
          python scripts/apply_debug_visualization_patch.py

      - name: Run sync-core unit tests
        working-directory: tests
        env:
          PYTHONPATH: ../scripts
        run: python -m unittest -v test_github_sync_core

      - name: Run commit-pinned review snapshot tests
        working-directory: tests
        env:
          PYTHONPATH: ../scripts
        run: python -m unittest -v test_github_sync_review

      - name: Run native editor extension tests
        working-directory: tests
        env:
          PYTHONPATH: ../scripts
        run: |
          python -m unittest -v test_native_editor_extensions
          python -m unittest -v test_preflight_features

      - name: Report scope
        run: echo "This workflow runs Python tests and applies the native GitHub import patch to official Godot source. It applies native preview-debug visualization patches and runs static/unit validation only; it does not compile or package Godot."

name: Validate Linux Project Sync Client

on:
  push:
    branches:
      - feature/linux-headless-agent-runtime
    paths:
      - "tools/**"
      - "docs/LINUX_HEADLESS_AGENT.md"
      - ".github/workflows/validate-linux-sync-client.yml"
  pull_request:
    paths:
      - "tools/**"
      - "docs/LINUX_HEADLESS_AGENT.md"
      - ".github/workflows/validate-linux-sync-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile tools/godot_project_sync.py tools/test_godot_project_sync.py
      - name: Run synchronization client tests
        working-directory: tools
        run: python3 -m unittest -v test_godot_project_sync
      - name: Package portable sync client
        run: |
          mkdir -p dist/godot-project-sync-client
          cp tools/godot_project_sync.py dist/godot-project-sync-client/
          cp tools/test_godot_project_sync.py dist/godot-project-sync-client/
          cp tools/README.md dist/godot-project-sync-client/
          cp docs/LINUX_HEADLESS_AGENT.md dist/godot-project-sync-client/
          tar -czf dist/godot-project-sync-client.tar.gz -C dist godot-project-sync-client
          sha256sum dist/godot-project-sync-client.tar.gz > dist/godot-project-sync-client.tar.gz.sha256
      - name: Upload sync client package
        uses: actions/upload-artifact@v4
        with:
          name: godot-linux-project-sync-client
          path: |
            dist/godot-project-sync-client.tar.gz
            dist/godot-project-sync-client.tar.gz.sha256
          retention-days: 90
